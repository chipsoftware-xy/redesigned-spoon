# Keeps the free Render server awake by visiting /api/health every 10 minutes.
# Render puts free servers to sleep after 15 minutes without a visitor.
name: Keep server awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {} # lets you also run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Visit the health page
        run: curl --fail --silent --show-error --max-time 60 --retry 3 --retry-delay 10 https://redesigned-spoon-1bl4.onrender.com/api/health
